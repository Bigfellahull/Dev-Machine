set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-passthrough on
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features ',xterm-ghostty:RGB'

# ── General ───────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=default,fg=colour8'
set -g status-left-length 40
set -g status-right-length 60

# ── Session ───────────────────────────────────────────────
set -g status-left \
'#[fg=colour4,bold] 󰆍 #S #[fg=colour8,nobold]│'

# ── Windows ───────────────────────────────────────────────
setw -g window-status-separator ''
setw -g window-status-format \
'#[fg=colour8]  #I:#W '
setw -g window-status-current-format \
'#[fg=colour4,bold]  ● #I:#W #[fg=colour8,nobold]'
setw -g window-status-activity-style 'fg=colour3'
setw -g window-status-bell-style 'fg=colour1,bold'

# ── Right-hand status ─────────────────────────────────────
set -g status-right \
'#[fg=colour8]│ 󰃭 %a %d %b  #[fg=colour4,bold]󰥔 %H:%M  '

# ── Pane borders and numbers ──────────────────────────────
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour4'
set -g display-panes-colour colour8
set -g display-panes-active-colour colour4
set -g display-panes-time 1500

# ── Messages and modes ────────────────────────────────────
set -g message-style 'bg=default,fg=colour4,bold'
set -g message-command-style 'bg=default,fg=colour4'
set -g mode-style 'fg=colour0,bg=colour4,bold'
set -g clock-mode-colour colour4

# Keep the default prefix so fresh machines remain unsurprising.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
